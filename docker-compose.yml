version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: school_erp_postgres
    restart: always
    environment:
      POSTGRES_USER: erp_user
      # Set in a local .env file next to this compose file (never commit real values)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: school_erp
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp_user -d school_erp']
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: school_erp_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. NestJS REST API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_erp_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: 'file:./dev.db'
      # Generate with: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Flutter Web App (Nginx)
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school_erp_web
    restart: always
    ports:
      - '80:80'
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
